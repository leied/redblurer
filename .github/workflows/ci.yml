name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # jsdom 30 requires ^22.22.2 || ^24.15.0 || >=26.
        node: ["22.x", "24.x", "26.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # No cache and no `npm ci`: package-lock.json is gitignored, and
          # both of those need a committed lockfile.

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

  no-dependencies:
    name: Tests without jsdom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      # The logic tests are meant to run on a bare checkout, with the DOM
      # tests skipping themselves. This job is what keeps that true.
      - name: Test with nothing installed
        run: npm test
