<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RedBlurer</title>
    <link rel="stylesheet" href="../ui/m3.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Deliberately short. Anything you reach for in a hurry lives here;
         everything else is one click away on the options page. -->
    <header class="top-app-bar">
      <span class="top-app-bar__leading" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
          <path
            d="M2.5 12C4.75 7.5 7.9 5.2 12 5.2s7.25 2.3 9.5 6.8c-2.25 4.5-5.4 6.8-9.5 6.8S4.75 16.5 2.5 12Z"
            stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
          <circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.7" />
          <path d="M4.5 4.5 19.5 19.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
      </span>
      <h1 class="top-app-bar__title">RedBlurer</h1>
      <span class="badge" id="version-badge">&#8212;</span>
      <button class="icon-button" id="open-options" type="button" aria-label="Open settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8" />
          <path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3 5.5 5.5"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
    </header>

    <main class="content">
      <section class="hero" id="hero">
        <div class="hero__text">
          <h2 class="hero__headline" id="enabled-label">Blur active</h2>
          <p class="hero__supporting" id="enabled-desc">Images and videos are hidden</p>
        </div>
        <div class="switch">
          <input class="switch__input" type="checkbox" role="switch" id="enabled"
            aria-labelledby="enabled-label" aria-describedby="enabled-desc" />
          <span class="switch__track" aria-hidden="true">
            <span class="switch__handle-container">
              <span class="switch__state-layer"></span>
              <span class="switch__handle">
                <svg class="switch__icon switch__icon--on" viewBox="0 0 16 16" width="16" height="16"><path d="M3.5 8.4l3 3 6-6.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
                <svg class="switch__icon switch__icon--off" viewBox="0 0 16 16" width="16" height="16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
              </span>
            </span>
          </span>
        </div>
      </section>

      <section class="card">
        <div class="list-item">
          <span class="list-item__text">
            <span class="list-item__headline" id="lockBlur-label">Hold everything blurred</span>
            <span class="list-item__supporting" id="lockBlur-desc">Ignore hover until you turn this off</span>
          </span>
          <div class="switch">
            <input class="switch__input" type="checkbox" role="switch" id="lockBlur"
              aria-labelledby="lockBlur-label" aria-describedby="lockBlur-desc" />
            <span class="switch__track" aria-hidden="true">
              <span class="switch__handle-container">
                <span class="switch__state-layer"></span>
                <span class="switch__handle">
                  <svg class="switch__icon switch__icon--on" viewBox="0 0 16 16" width="16" height="16"><path d="M3.5 8.4l3 3 6-6.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
                  <svg class="switch__icon switch__icon--off" viewBox="0 0 16 16" width="16" height="16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
                </span>
              </span>
            </span>
          </div>
        </div>
        <div class="list-item" id="blurThisSite-item">
          <span class="list-item__text">
            <span class="list-item__headline" id="blurThisSite-label">Blur this site</span>
            <span class="list-item__supporting" id="blurThisSite-desc">Checking the current tab&#8230;</span>
          </span>
          <div class="switch">
            <input class="switch__input" type="checkbox" role="switch" id="blurThisSite"
              aria-labelledby="blurThisSite-label" aria-describedby="blurThisSite-desc" />
            <span class="switch__track" aria-hidden="true">
              <span class="switch__handle-container">
                <span class="switch__state-layer"></span>
                <span class="switch__handle">
                  <svg class="switch__icon switch__icon--on" viewBox="0 0 16 16" width="16" height="16"><path d="M3.5 8.4l3 3 6-6.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
                  <svg class="switch__icon switch__icon--off" viewBox="0 0 16 16" width="16" height="16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
                </span>
              </span>
            </span>
          </div>
        </div>
      </section>

      <p class="footnote">
        <kbd id="shortcut-panic">Alt+Shift+H</kbd> hides everything instantly.
      </p>
    </main>

    <div class="snackbar" id="snackbar" role="status" aria-live="polite"></div>

    <script src="../shared/config.js"></script>
    <script src="../ui/store.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
